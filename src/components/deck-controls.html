  <div class="tools" data-controls hidden role="group" aria-label="Opciones de presentación">
    <button class="control motion-toggle" type="button" aria-label="Reducir movimiento" aria-pressed="false" title="Reducir movimiento"><span class="motion-icon" aria-hidden="true"></span></button>
    <button class="control fullscreen-toggle" type="button" aria-label="Pantalla completa" aria-pressed="false" title="Pantalla completa"><span class="fullscreen-icon" aria-hidden="true"></span></button>
  </div>
  <nav class="deck-nav" data-controls hidden aria-label="Diapositivas">
    <button type="button" class="control previous" aria-label="Diapositiva anterior" aria-disabled="true" title="Anterior (←)"><span aria-hidden="true">←</span></button>
    <span class="deck-count" aria-hidden="true">01 / 10</span>
    <div class="deck-steps" role="group" aria-label="Ir a una diapositiva"></div>
    <button type="button" class="control next" aria-label="Diapositiva siguiente" title="Siguiente (→)"><span aria-hidden="true">→</span></button>
  </nav>
  <div class="sr-only" id="deck-status" role="status"></div>
